# Voxy NeoForge Build CI
# Validates build integrity on every push and pull request

name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sodium:
          - label: sodium-0.8.13
            gradle_args: ""
          - label: sodium-0.8.12
            gradle_args: "-Psodium_version=0.8.12+mc1.21.1 -Psodium_config_api_version=0.8.12+mc1.21.1 -Psodium_min_version=0.8.12"
          - label: sodium-0.6.13
            gradle_args: "-Psodium_module=maven.modrinth:sodium -Psodium_mod_module=maven.modrinth:sodium -Psodium_version=mc1.21.1-0.6.13-neoforge -Psodium_min_version=0.6.13"

    steps:
      - name: Extract current branch name
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          else
            ref="${GITHUB_REF#refs/heads/}"
            echo "branch=${ref////-}" >> $GITHUB_OUTPUT
          fi
        id: ref

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Execute Gradle build
        run: ./gradlew build --console=plain ${{ matrix.sodium.gradle_args }}
        env:
          GITHUB_ACTIONS: true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: voxy-artifacts-${{ steps.ref.outputs.branch }}-${{ matrix.sodium.label }}
          path: build/libs/*.jar
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ steps.ref.outputs.branch }}-${{ matrix.sodium.label }}
          path: build/reports/**/*
          retention-days: 7
