name: Dedicated Server Smoke

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run dedicated-server smoke test
        run: bash scripts/ci_server_smoke.sh
        env:
          GITHUB_ACTIONS: true
          VOXY_SERVER_SMOKE_TIMEOUT: 300

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedicated-server-smoke-log
          path: |
            build/server-smoke/**
            runs/server/logs/**
            runs/server/crash-reports/**
